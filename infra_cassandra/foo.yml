# Headless Service for Cassandra
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels:
    app: cassandra
spec:
  type: LoadBalancer
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
    - name: intra-node
      port: 7000
    - name: intra-node-tls
      port: 7001
    - name: jmx
      port: 7199
---
# StatefulSet for Cassandra
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  labels:
    app: cassandra
spec:
  serviceName: cassandra
  replicas: 3 # Number of Cassandra nodes
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:latest
          ports:
            - containerPort: 7000
              name: intra-node
            - containerPort: 7001
              name: intra-node-tls
            - containerPort: 7199
              name: jmx
            - containerPort: 9042
              name: cql
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "K8sCluster"
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.default.svc.cluster.local" # Seed for first node
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "100M"
            - name: CASSANDRA_DC
              value: "DC1"
            - name: CASSANDRA_RACK
              value: "Rack1"
            - name: CASSANDRA_AUTO_BOOTSTRAP
              value: "false"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "nodetool status"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 32Gi
